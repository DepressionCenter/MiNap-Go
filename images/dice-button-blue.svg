<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft shadow matching Sheet's material design -->
    <filter id="diceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1a73e8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <style>
    .button-group { 
      cursor: pointer; 
    }
    
    /* Light blue button base with interactive states */
    .btn-bg {
      fill: #e8f0fe; /* Google light blue */
      stroke: #aecbfa; /* Slightly darker outline */
      stroke-width: 2;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }
    .button-group:hover .btn-bg {
      fill: #d2e3fc; /* Darkens on hover */
      stroke: #1a73e8; /* Solid Google blue border */
    }
    
    /* Button press animation */
    .button-container {
      transition: transform 0.1s ease;
      transform-origin: 50px 50px;
    }
    .button-group:active .button-container { 
      transform: scale(0.94); 
    }
    
    /* Smooth tumbling physics for the dice */
    .die1, .die2 { 
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .die1 { 
      transform-origin: 36px 40px; 
      transform: rotate(-10deg); 
    }
    .die2 { 
      transform-origin: 64px 60px; 
      transform: rotate(15deg); 
    }
    
    .button-group:hover .die1 { 
      transform: rotate(-100deg) translate(-2px, -4px) scale(1.05); 
    }
    .button-group:hover .die2 { 
      transform: rotate(105deg) translate(4px, -2px) scale(1.05); 
    }
    
    /* Dice colors */
    .die-body {
      fill: #ffffff;
      stroke: #aecbfa;
      stroke-width: 1;
      filter: url(#diceShadow);
    }
    .dot {
      fill: #1a73e8; /* Google primary blue */
    }
  </style>
  <g class="button-group">
    <g class="button-container">
      <!-- Circular Button Background -->
      <circle class="btn-bg" cx="50" cy="50" r="44" />
      <!-- Die 1 (Left/Top) - Shows 5 -->
      <g class="die1">
        <rect class="die-body" x="18" y="22" width="36" height="36" rx="6" />
        <circle class="dot" cx="36" cy="40" r="3.5" />
        <circle class="dot" cx="26" cy="30" r="3.5" />
        <circle class="dot" cx="46" cy="30" r="3.5" />
        <circle class="dot" cx="26" cy="50" r="3.5" />
        <circle class="dot" cx="46" cy="50" r="3.5" />
      </g>
      <!-- Die 2 (Right/Bottom) - Shows 3 -->
      <g class="die2">
        <rect class="die-body" x="46" y="42" width="36" height="36" rx="6" />
        <circle class="dot" cx="54" cy="50" r="3.5" />
        <circle class="dot" cx="64" cy="60" r="3.5" />
        <circle class="dot" cx="74" cy="70" r="3.5" />
      </g>
    </g>
  </g>
</svg>
